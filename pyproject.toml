[project]
name = "roadguard"
version = "0.1.0"
description = "RoadGuard AI: predictive maintenance and risk intelligence for road infrastructure."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
